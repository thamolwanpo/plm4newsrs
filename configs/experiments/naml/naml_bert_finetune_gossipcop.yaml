# Dataset configuration
dataset: "gossipcop"
experiment_name: "naml_model"
model_type: "clean"

# Architecture
architecture: "naml"
word_embedding_dim: 768 # BERT embedding size

# Model configuration
model_name: "bert-base-uncased"
use_pretrained_lm: true
fine_tune_lm: true
finetune_layers: 2 # Fine-tune last 2 layers of BERT

# GloVe-specific (not used with BERT)
glove_file_path: "lm_models/glove.42B.300d.txt"
glove_model: "glove-42B-300"
glove_dim: 300
glove_aggregation: "attention"

# Multi-view configuration (which views to use)
use_title: true
use_body: true
use_category: false  # Disabled for now
use_subcategory: false  # Disabled for now

# Text encoder hyperparameters
max_title_length: 30
max_body_length: 100

# For additive attention
query_vector_dim: 200

# CNN configuration
num_filters: 300  # Must match attention_hidden_dim (200) for dimension compatibility
window_sizes: [3]  # Single window size as per reference implementation

# Category/subcategory configuration (if enabled)
num_categories: 100
category_embedding_dim: 100
num_subcategories: 200
subcategory_embedding_dim: 100

# Attention configuration
attention_hidden_dim: 200
max_history_length: 50
drop_rate: 0.2

# Training hyperparameters
epochs: 3 
train_batch_size: 32  # Larger batch since less memory needed
val_batch_size: 64
learning_rate: 2.0e-5
early_stopping_patience: 3

# Paths
base_dir: null
models_dir: null

# Reproducibility
seed: 42

# Additional training options
gradient_clip_val: 1.0
warmup_steps: 0