# Dataset configuration
dataset: "gossipcop"
experiment_name: "nrms_model"
model_type: "clean"

# Architecture
architecture: "nrms"

# Model configuration
model_name: "bert-base-uncased"
use_pretrained_lm: true
fine_tune_lm: false
finetune_layers: 0  # Number of last layers to fine-tune (BERT-base has 12 layers)

# Architecture hyperparameters
max_seq_length: 30
max_history_length: 30

# Multi-head self-attention (for news encoder)
num_attention_heads: 16
attention_hidden_dim: 200

# Multi-head self-attention (for user encoder)
num_user_attention_heads: 16

drop_rate: 0.2

# Training hyperparameters
epochs: 3
train_batch_size: 16
val_batch_size: 32
learning_rate: 2.0e-5
early_stopping_patience: 3

# Paths
base_dir: null
models_dir: null

# Reproducibility
seed: 42

# Additional training options
gradient_clip_val: 1.0
warmup_steps: 0